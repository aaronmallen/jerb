[package]
categories = ["asynchronous", "concurrency", "database"]
description = "Background jobs for Rust with typed handlers, retries, cron schedules, and SQL or Redis storage."
edition = "2024"
include = ["CHANGELOG.md", "LICENSE", "README.md", "src/**/*"]
keywords = ["background-jobs", "job-queue", "scheduler", "sidekiq", "worker"]
license = "MIT"
name = "jerb"
readme = "README.md"
repository = "https://aaronmallen.dev/aaron/jerb"
rust-version = "1.94"
version = "0.1.0"

[package.metadata.docs.rs]
all-features = true

[workspace]
members = ["macros"]

[features]
dashboard = ["dep:axum"]
default = ["sqlite"]
mysql = [
  "dep:sea-orm",
  "dep:sea-orm-migration",
  "sea-orm/runtime-tokio-rustls",
  "sea-orm/sqlx-mysql",
  "sea-orm-migration/sqlx-mysql",
  "dep:sha2",
]
postgres = [
  "dep:sea-orm",
  "dep:sea-orm-migration",
  "sea-orm/sqlx-postgres",
  "sea-orm-migration/sqlx-postgres",
  "dep:sha2",
]
redis = ["dep:redis", "redis/connection-manager", "redis/tokio-comp"]
sqlite = [
  "dep:sea-orm",
  "dep:sea-orm-migration",
  "sea-orm/sqlx-sqlite",
  "sea-orm-migration/sqlx-sqlite",
  "dep:sha2",
]

[dependencies]
async-trait = "0.1"
axum = { default-features = false, optional = true, version = "0.8" }
chrono = { default-features = false, features = ["clock"], version = "0.4" }
croner = "4"
getset = "0.1"
inventory = "0.3"
jerb-macros = { path = "macros", version = "0.1" }
redis = { default-features = false, features = [
  "script",
], optional = true, version = "1" }
sea-orm = { default-features = false, features = [
  "macros",
  "runtime-tokio",
  "sqlite-use-returning-for-3_35",
  "with-json",
], optional = true, version = "2" }
sea-orm-migration = { default-features = false, features = [
  "runtime-tokio",
], optional = true, version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { optional = true, version = "0.10" }
thiserror = "2"
tokio = { features = ["rt", "time"], version = "1" }

[dev-dependencies]
pretty_assertions = "1"
tokio = { features = ["macros", "rt", "rt-multi-thread"], version = "1" }
toml = "1"
tower = { features = ["util"], version = "0.5" }
trybuild = "1"
