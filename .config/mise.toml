[env]
_.file = [".env"]

[settings]
lockfile = true

[task_config]
includes = ["scripts"]

[tasks.format]
alias = ["fmt"]
description = "Format all files"
depends = ["format:**"]

[tasks.lint]
alias = ["l"]
description = "Lint all files"
depends = ["lint:**"]

[tasks.test]
alias = ["t"]
description = "Run all tests"
depends = ["test:**"]

[tools]
"cargo:cargo-llvm-cov" = "latest"
"cargo:cargo-nextest" = "latest"
"cargo:cargo-sort" = "latest"
editorconfig-checker = "latest"
markdownlint-cli2 = "latest"
node = "latest"
shellcheck = "latest"
shfmt = "latest"
taplo = "latest"
usage = "latest"
yamlfmt = "latest"

[[tools.rust]]
components = "clippy,llvm-tools-preview"
version = "latest"

[[tools.rust]]
components = "rustfmt"
version = "nightly"
